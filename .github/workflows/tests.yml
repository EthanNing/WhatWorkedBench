name: Evaluation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python scripts/run_baseline.py --task scifact --budget 8 --output output/smoke
      - run: python scripts/audit_results.py
